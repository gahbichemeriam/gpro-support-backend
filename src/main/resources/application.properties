spring.application.name=gpro-support-backend

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/gpro_support
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== Upload de fichiers =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# ===== JWT =====
# Clé secrète : minimum 32 caractères pour l'algorithme HS256
app.jwt.secret=gpro-support-secret-key-2026-very-long-and-secure
# Expiration : 24 heures en millisecondes (24 * 60 * 60 * 1000)
app.jwt.expiration=86400000
